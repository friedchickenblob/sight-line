name: Commit format

# Checks every new commit on every branch (and pull request titles, which
# become the commit message when a PR is squash-merged).
on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check commit messages
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          else
            # New branch or force-push: check everything not already on the default branch
            range="origin/$DEFAULT_BRANCH..$AFTER"
          fi

          failed=0
          for sha in $(git rev-list --no-merges "$range"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            if ! sh .githooks/check-commit-msg "$RUNNER_TEMP/msg"; then
              echo "::error::Commit ${sha:0:7} doesn't follow the commit format: $(head -n1 "$RUNNER_TEMP/msg")"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo
            echo "Fix the latest commit's message with:   git commit --amend"
            echo "Fix older commits with:                  git rebase -i <base>   (mark them 'reword')"
            echo "Then push again (git push --force-with-lease on your own branch)."
            exit 1
          fi
          echo "All commits in $range follow the format."

      - name: Check pull request title
        if: always() && github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          if ! sh .githooks/check-commit-msg "$RUNNER_TEMP/title"; then
            echo "::error::The pull request title must follow the commit format, because it becomes the commit message on squash-merge."
            exit 1
          fi
