name: Claude

# Runs Claude on GitHub's servers (your laptop can be off) when someone with write access:
#   - comments "@claude ..." on an issue or pull request, or
#   - adds the "claude-ok" label to an issue.
# Claude follows CLAUDE.md, works on a jordan/claude-... branch and opens a pull request.
# One-time setup: README -> "Claude on GitHub".
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, labeled]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action == 'opened' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude-ok')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One run per issue / PR at a time; later requests wait instead of racing
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        env:
          # Lets Claude open the pull request itself with the gh CLI (see CLAUDE.md).
          # Needs "Allow GitHub Actions to create and approve pull requests" in the repo's Actions settings.
          GH_TOKEN: ${{ github.token }}
        with:
          # Uses a Claude Pro/Max subscription. To bill an API account instead, replace this
          # line with: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude-ok
          # Keeps Claude's branches inside the branch-name rule (owner/kebab-case)
          branch_prefix: jordan/claude-
          # --max-turns caps a single run so a stuck task can't burn through usage overnight.
          # The allowed tools let Claude check its PR title and open the PR from the template.
          claude_args: >-
            --max-turns 30
            --allowedTools "Bash(sh .githooks/check-commit-msg:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr list:*)"
